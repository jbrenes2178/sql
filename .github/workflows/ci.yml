name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optica
          POSTGRES_PASSWORD: optica
          POSTGRES_DB: optica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optica"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://optica:optica@localhost:5432/optica?schema=public
      TEST_DATABASE_URL: postgresql://optica:optica@localhost:5432/optica?schema=public
      APP_URL: http://localhost:3000
      APP_ENV: test
      TZ: America/Costa_Rica
      BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
